name: Docker Image CI

on:
  schedule:
    - cron: '4 20 1 * 4'
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'release/*'
      - 'renovate/*'


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Log into DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log into GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Tags
        id: meta
        run: |
          branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
          tags="ghcr.io/${{ github.repository }}:${branch},${{ github.repository }}:${branch}"
          if [[ $(date '+%d') == 01 || "${{ github.event_name }}" == "push" && "$branch" == "main" ]]; then
            tags="${tags},ghcr.io/${{ github.repository }}:latest,${{ github.repository }}:latest,\
                  ghcr.io/${{ github.repository }}:$(date '+%Y-%m-%d'),${{ github.repository }}:$(date '+%Y-%m-%d')"
          fi
          echo "::set-output name=tags::${tags}"
          echo "image_ref=ghcr.io/${{ github.repository }}:${branch}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        # with:
        #   buildkitd-flags: 

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64 #,linux/riscv64

      - name: Download Trivy vulnerability database
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          command: download
          vuln-type: os
          format: json
          output: trivy-download-report.json

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ steps.meta.outputs.image_ref }}'
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: 'trivy-results.sarif'
          sarif: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          path: trivy-results.sarif
